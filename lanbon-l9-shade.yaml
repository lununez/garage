substitutions:
  device_name: lanbon-l9
  friendly_name: Lanbon L9
  shade_entity: "cover.right_window_shade"
  invert_cover_position: "false"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200
  hardware_uart: UART0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.2.226
    gateway: 192.168.2.1
    subnet: 255.255.255.0
  ap:
    ssid: "L9"
    password: "blue7seas"

psram:
  mode: quad
  speed: 80MHz

output:
  - platform: ledc
    pin: GPIO21
    id: lcd_backlight_output

light:
  - platform: monochromatic
    name: "Display Backlight"
    id: display_backlight
    output: lcd_backlight_output
    restore_mode: ALWAYS_ON

i2c:
  - id: touchscreen_i2c
    sda: GPIO4
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    frequency: 100kHz
    scan: true

spi:
  id: display_spi
  clk_pin: GPIO26
  mosi_pin: GPIO14

display:
  - id: my_display
    platform: mipi_spi
    model: st7789v
    spi_id: display_spi
    bus_mode: single
    dc_pin: GPIO27
    cs_pin: GPIO25
    dimensions:
      height: 320
      width: 170
      offset_width: 35
    invert_colors: true
    color_order: BGR
    color_depth: 16BIT
    auto_clear_enabled: false
    update_interval: 250ms
    data_rate: 40MHz

touchscreen:
  - platform: ft63x6
    id: my_touchscreen
    display: my_display
    i2c_id: touchscreen_i2c
    calibration:
      x_min: 0
      y_min: 0
      x_max: 169
      y_max: 319

globals:
  - id: ui_pos_cache
    type: int
    initial_value: "0"
  - id: ha_pos_cache
    type: int
    initial_value: "0"
  - id: last_send_ms
    type: uint32_t
    initial_value: "0"
  - id: last_sent_ha_pos
    type: int
    initial_value: "-1"
  - id: track_x
    type: int
    initial_value: "35"
  - id: track_y
    type: int
    initial_value: "48"
  - id: track_w
    type: int
    initial_value: "100"
  - id: track_h
    type: int
    initial_value: "215"

script:
  - id: debounce_shade
    mode: restart
    parameters:
      target_pos: int
    then:
      - delay: 400ms
      - lambda: 'id(last_send_ms) = millis();'
      - homeassistant.service:
          service: cover.set_cover_position
          data:
            entity_id: cover.right_window_shade
            position: !lambda "return target_pos;"

sensor:
  - platform: wifi_signal
    name: Wifi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
  - platform: internal_temperature
    name: "Internal Temperature"

  - platform: homeassistant
    id: ha_shade_position
    entity_id: cover.right_window_shade
    attribute: current_position
    on_value:
      - if:
          condition:
            lambda: 'return (millis() - id(last_send_ms)) > 35000;'
          then:
            - lvgl.slider.update:
                id: shade_slider
                value: !lambda "return (int)x;"

binary_sensor:
  - platform: gpio
    name: "Proximity Sensor"
    id: proximity_sensor
    pin: GPIO15
    device_class: motion
    filters:
      - delayed_off: 15s
    on_press:
      - light.turn_on: display_backlight
      - if:
          condition:
            lambda: 'return id(ha_shade_position).has_state();'
          then:
            - lvgl.slider.update:
                id: shade_slider
                value: !lambda "return (int)id(ha_shade_position).state;"
    on_release:
      - light.turn_off: display_backlight

text_sensor:
  - platform: wifi_info
    ssid:
      name: ESP Connected SSID
    mac_address:
      name: ESP Mac Wifi Address

font:
  - file: gfonts://Outfit
    id: outfit_22
    size: 22
  - file: gfonts://Outfit
    id: outfit_16
    size: 16
  - file: >-
      https://github.com/Pictogrammers/pictogrammers.github.io/raw/refs/heads/main/@mdi/font/7.4.47/fonts/materialdesignicons-webfont.ttf
    id: arrow_font
    size: 45
    glyphs:
      - "\U000F0143"
      - "\U000F0140"
      - "\U000F0141"
      - "\U000F0142"

lvgl:
  pages:
    - id: shade
      widgets:
        - obj:
            id: bg_panel
            width: 170
            height: 320
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
        - label:
            id: label_718
            x: 35
            y: 10
            width: 100
            height: 42
            text: "Window\nShades"
            text_align: CENTER
            text_font: outfit_16
            text_color: 0xFFFFFF
        - slider:
            id: shade_slider
            x: 30
            y: 62
            width: 110
            height: 235
            value: 100
            bg_color: 0xFFAA44
            bg_opa: COVER
            radius: 15
            indicator:
              bg_color: 0xFFEECC
              bg_opa: COVER
              radius: 15
            knob:
              bg_opa: TRANSP
              pad_all: 0
              pad_top: -50
              pad_bottom: -50
              pad_left: 0
              pad_right: 0
            on_value:
              - lambda: 'id(last_send_ms) = millis();'
              - script.execute:
                  id: debounce_shade
                  target_pos: !lambda "return (int)x;"
        - button:
            id: up_button
            x: 30
            y: 65
            width: 110
            height: 60
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            on_click:
              - lambda: 'id(last_send_ms) = millis();'
              - homeassistant.service:
                  service: cover.open_cover
                  data:
                    entity_id: cover.right_window_shade
              - lvgl.slider.update:
                  id: shade_slider
                  value: 100
            widgets:
              - label:
                  id: up_button_label
                  width: 110
                  height: 60
                  text: "\U000F0143"
                  text_font: arrow_font
                  text_color: 0xFFEECC
                  text_align: CENTER
                  align: CENTER
        - button:
            id: down_button
            x: 30
            y: 236
            width: 110
            height: 60
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            on_click:
              - lambda: 'id(last_send_ms) = millis();'
              - homeassistant.service:
                  service: cover.close_cover
                  data:
                    entity_id: cover.right_window_shade
              - lvgl.slider.update:
                  id: shade_slider
                  value: 0
            widgets:
              - label:
                  id: down_button_label
                  width: 110
                  height: 60
                  text: "\U000F0140"
                  text_font: arrow_font
                  text_color: 0xFFAA44
                  text_align: CENTER
                  align: CENTER
        - button:
            id: next_page_btn
            x: 135
            y: 286
            width: 35
            height: 33
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            on_click:
              - lvgl.page.show:
                  id: page_2
                  animation: MOVE_LEFT
            widgets:
              - label:
                  id: next_page_btn_label
                  width: 35
                  height: 33
                  text: "\U000F0142"
                  text_font: arrow_font
                  text_color: 0x888888
                  text_align: CENTER
                  align: CENTER
    - id: page_2
      widgets:
        - obj:
            id: bg_panel_2
            width: 170
            height: 320
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 0
            radius: 0
        - label:
            id: page_2_placeholder
            y: 150
            width: 170
            height: 30
            text: "Page 2"
            text_align: CENTER
            text_font: outfit_22
            text_color: 0xFFFFFF
        - button:
            id: prev_page_btn
            y: 280
            width: 40
            height: 40
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            on_click:
              - lvgl.page.show:
                  id: shade
                  animation: MOVE_RIGHT
            widgets:
              - label:
                  id: label_693
                  width: 40
                  height: 40
                  text: "\U000F0141"
                  text_font: arrow_font
                  text_color: 0x888888
                  text_align: CENTER
                  align: CENTER
